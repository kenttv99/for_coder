<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <style>
      .navy { fill: #001535; }
      .navy-stroke { stroke: #001535; fill: none; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .teal-stroke { stroke: #5CCCCC; fill: none; stroke-width: 8; stroke-linecap: round; }
      .white { fill: #ffffff; }
    </style>
  </defs>

  <!-- Anchor Section -->
  <g transform="translate(300, 80) scale(0.8)">
    <!-- Teal Ribbon Swirl -->
    <path d="M-60,-20 Q-30,-50 0,-20 T60,-20" class="teal-stroke" stroke-width="6" opacity="0.8" />
    <path d="M-60,20 Q-30,50 0,20 T60,20" class="teal-stroke" stroke-width="6" opacity="0.8" />

    <!-- Anchor -->
    <circle cx="0" cy="-40" r="12" class="navy-stroke" stroke-width="6" />
    <line x1="0" y1="-28" x2="0" y2="40" class="navy-stroke" stroke-width="6" />
    <line x1="-30" y1="-10" x2="30" y2="-10" class="navy-stroke" stroke-width="6" />
    <path d="M-40,20 Q-40,60 0,60 Q40,60 40,20" class="navy-stroke" stroke-width="6" />
    <path d="M-40,20 L-50,30 M-40,20 L-30,30" class="navy-stroke" stroke-width="4" /> <!-- Left Arrow -->
    <path d="M40,20 L30,30 M40,20 L50,30" class="navy-stroke" stroke-width="4" /> <!-- Right Arrow -->
  </g>

  <!-- Yacht Section -->
  <g transform="translate(50, 150)">
    <!-- Main Hull (Dark Navy) -->
    <!-- Creating a sleek hull shape -->
    <path d="M20,130 
             L60,80 
             L450,50 
             L500,60 
             L450,130 
             Q250,160 20,130 Z" 
          class="navy" />
    
    <!-- Upper Deck / Cabin Structure (White mostly, cutting into hull or layered) -->
    <!-- Actually, let's draw the superstructure above the hull line -->
    
    <!-- Redrawing Hull to be lower part -->
    <path d="M40,100 L480,60 L420,130 Q230,160 40,130 Z" class="navy" />
    
    <!-- 3 Portholes on Hull -->
    <rect x="220" y="105" width="25" height="8" rx="4" class="white" />
    <rect x="255" y="102" width="25" height="8" rx="4" class="white" />
    <rect x="290" y="99" width="25" height="8" rx="4" class="white" />

    <!-- Superstructure (White with Navy outlines/windows) -->
    <!-- Base of superstructure -->
    <path d="M80,95 L440,62 L430,40 L150,50 Z" class="white" />
    <!-- Roof/Flybridge -->
    <path d="M120,52 L140,20 L300,15 L350,45" fill="none" stroke="#001535" stroke-width="4" />
    <path d="M120,52 L430,40" fill="none" stroke="#001535" stroke-width="3" />
    
    <!-- Side Window (Dark shape) -->
    <path d="M150,50 Q250,40 320,45 L310,25 Q200,25 145,25 Z" class="navy" />
    
    <!-- Bow Railing details -->
    <line x1="380" y1="42" x2="400" y2="30" stroke="#001535" stroke-width="2" />
    <line x1="410" y1="40" x2="430" y2="28" stroke="#001535" stroke-width="2" />
    <line x1="380" y1="30" x2="460" y2="25" stroke="#001535" stroke-width="2" />

    <!-- Radar/Antenna bump -->
    <path d="M180,20 Q190,5 200,20" class="navy" />

  </g>

  <!-- Bottom Wave (Teal) -->
  <path d="M50,290 Q250,250 550,290" class="teal-stroke" stroke-width="12" />
  <path d="M80,305 Q280,265 520,305" class="teal-stroke" stroke-width="6" opacity="0.6" />

</svg>
